name: CI

# Every push and every pull request runs the same checks as `npm run verify`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must succeed without a key: the site falls back to demo
          # mode, and no test or build step may ever spend a generation credit.
          NEXT_PUBLIC_SITE_URL: https://example.com
